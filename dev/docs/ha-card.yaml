# Option A — retrouver Heure / Jour / Semaine / Mois et des barres par jour.
# À mettre dans configuration.yaml : quatre compteurs d'énergie dérivés du cumul.
# utility_meter traite une baisse de la source comme une remise à zéro du capteur
# (changement de piles) ; aucun réglage n'est nécessaire pour ça.
#
# utility_meter:
#   pluie_heure:
#     source: sensor.jardin_vevor_7_in_1_weather_station_rain_total
#     cycle: hourly
#   pluie_jour:
#     source: sensor.jardin_vevor_7_in_1_weather_station_rain_total
#     cycle: daily
#   pluie_semaine:
#     source: sensor.jardin_vevor_7_in_1_weather_station_rain_total
#     cycle: weekly
#   pluie_mois:
#     source: sensor.jardin_vevor_7_in_1_weather_station_rain_total
#     cycle: monthly
#
# Puis, à la place du bloc « Pluie » ci-dessus :
#
#   - type: grid
#     columns: 4
#     square: false
#     cards:
#       - type: custom:mushroom-entity-card
#         entity: sensor.pluie_heure
#         name: Heure
#         icon: mdi:weather-pouring
#         icon_color: light-blue
#         layout: vertical

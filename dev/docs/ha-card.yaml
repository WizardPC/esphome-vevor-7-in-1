# =============================================================================
# Carte Lovelace — Station Vevor 7-en-1 (868 MHz, ESP32-C3 SuperMini + CC1101)
#
# C'est la carte RÉELLEMENT EN SERVICE chez le propriétaire, versionnée ici comme référence du
# projet (elle remplace la carte précédente, dont le bandeau de prévision devient l'option G en fin
# de fichier, avec les options A à F déjà présentes).
#
# Préfixe des entités : RELEVÉ dans Home Assistant, jamais déduit du firmware. L'appareil y est
# nommé « Jardin Vevor 7 in 1 Weather Station », d'où `jardin_vevor_7_in_1_weather_station` (le
# firmware, lui, déclare friendly_name « Vevor 7-in-1 weather station » et son commentaire dit de
# renommer côté HA, pas ici). Liste mesurée : dev/docs/ha-entities.txt — la relire
# (`.venv/bin/python dev/tools/check_ha_card.py --refresh`) après tout renommage d'appareil ou
# nouvelle entité. Un renommage dans HA renomme tous les entity_id d'un coup.
# Autre nom d'appareil chez vous ? Remplacez le préfixe partout :
#     sed -i 's/jardin_vevor_7_in_1_weather_station/vevor_7in1/g' ha-card.yaml
#
# SECTION « RÉCEPTION » — ce qu'elle mesure, et ce qu'elle ne mesure pas
#   * « Dernière trame » se lit sur `TX counter` : la SEULE entité déplacée à chaque trame (publiée
#     dans le gestionnaire de trame du YAML). Les compteurs republiés par l'intervalle de 10 s ont
#     un horodatage quantifié, et ESPHome ne republie pas une valeur identique.
#     Seuils 35 / 60 / 180 s : 35 = cadence de 20 s plus gigue, 60 = ré-armement du garde-fou,
#     180 = redémarrage de la carte. Les deux derniers sont les valeurs PAR DÉFAUT du composant
#     (vevor_7in1.h — creneaux_avant_rearmement_ = 3 créneaux de 20 s, duree_max_avant_redemarrage_s_
#     = 180) ; elles se règlent dans HA, entités « Watchdog ... ».
#   * « Taux de réception » lit `reception_rate` : la part des ÉMISSIONS de la station réellement
#     décodées, calculée par le composant d'après le compteur embarqué de la station (39 unités =
#     une émission, soit 20 s), sur la fenêtre des 30 dernières trames décodées (≈10 min quand tout
#     passe ; plus long quand ça se dégrade, le dénominateur n'existant qu'entre deux trames reçues).
#     Ce n'est PAS le rapport OK/(OK+KO) : celui-ci mesurait la part des trames valides PARMI LES
#     TENTATIVES, confondait « la station n'émet pas » avec « on ne l'entend pas », et laissait les
#     captures d'un émetteur tiers gonfler « Rejected frames » — mesuré le 07/10/2026 : 39 rejets en
#     30 min pour UNE SEULE émission de la station manquée.
#     Ses DEUX TERMES sont affichés (`reception_window_decoded` / `reception_window_emitted`) : la
#     carte écrit « 29 / 30 » et le pourcentage se vérifie au lieu de se croire sur parole.
#     Bandes 90 / 70 % : un choix d'affichage, pas une vérité (nuit du 06-07/10 : 64 % avec
#     l'émetteur tiers actif, 100 % une fois le canal rendu).
#   * LIMITE ASSUMÉE : un template qui utilise now() n'est réévalué qu'au début de chaque minute
#     (helpers/event.py — async_track_utc_time_change(..., second=0)) et à chaque changement d'état
#     de l'entité citée. L'âge affiché est donc un INSTANTANÉ pris au rendu, pas un compteur qui
#     défile ; le verdict, lui, reste juste à moins d'une minute près.
#
# COMPTEURS DE PLUIE : heure / jour / semaine / mois viennent de compteurs d'UTILITÉ côté Home
# Assistant (utility_meter sur `rain_total`), pas du firmware — celui-ci ne publie qu'un cumul.
# Déclarés comme helpers du propriétaire dans dev/tools/check_ha_card.py et dans dev/docs/ha-entities.txt.
# =============================================================================
type: vertical-stack
cards:
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_tx_counter
        primary: >-
          {% set e = states.sensor.jardin_vevor_7_in_1_weather_station_tx_counter %}
          {% set age = (now() - e.last_changed).total_seconds() if e is not none and e.state not in ('unknown', 'unavailable') and e.last_changed else none %}
          {% if age is none %}inconnu {% elif age < 60 %}il y a {{ age | round(0) | int }} s {% elif age < 3600 %}il y a {{ (age / 60) | round(0) | int }} min {% else %}il y a {{ (age / 3600) | round(1) }} h {% endif %}
        secondary: >-
          {% set e = states.sensor.jardin_vevor_7_in_1_weather_station_tx_counter %}
          {% set age = (now() - e.last_changed).total_seconds() if e is not none and e.state not in ('unknown', 'unavailable') and e.last_changed else none %}
          {% if age is none %}Carte injoignable, ou entité absente {% else %}Trame {{ e.state | int }} à {{ as_timestamp(e.last_changed) | timestamp_custom('%H:%M:%S', true) }} — {% if age <= 35 %}Réception normale {% elif age <= 60 %}Trame manquée {% elif age <= 180 %}Silence (ré-armement) {% else %}Silence (reboot) {% endif %}{% endif %}
        icon: >-
          {% set e = states.sensor.jardin_vevor_7_in_1_weather_station_tx_counter %}
          {% set age = (now() - e.last_changed).total_seconds() if e is not none and e.state not in ('unknown', 'unavailable') and e.last_changed else none %}
          {% if age is none %}mdi:help-circle-outline {% elif age <= 35 %}mdi:clock-check-outline {% elif age <= 180 %}mdi:clock-alert-outline {% else %}mdi:clock-remove-outline {% endif %}
        icon_color: >-
          {% set e = states.sensor.jardin_vevor_7_in_1_weather_station_tx_counter %}
          {% set age = (now() - e.last_changed).total_seconds() if e is not none and e.state not in ('unknown', 'unavailable') and e.last_changed else none %}
          {% if age is none %}grey {% elif age <= 35 %}green {% elif age <= 60 %}amber {% elif age <= 180 %}orange {% else %}red {% endif %}
      - type: custom:mushroom-template-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_reception_rate
        primary: >-
          {% set r = states('sensor.jardin_vevor_7_in_1_weather_station_reception_rate') | float(none) %}
          {% if r is none %}en attente {% else %}{{ r | round(1) }} % {% endif %}
        secondary: >-
          {% set rd = states('sensor.jardin_vevor_7_in_1_weather_station_reception_window_decoded') | float(none) %}
          {% set re = states('sensor.jardin_vevor_7_in_1_weather_station_reception_window_emitted') | float(none) %}
          {% set ok = states('sensor.jardin_vevor_7_in_1_weather_station_valid_frames') | float(none) %}
          {% set ko = states('sensor.jardin_vevor_7_in_1_weather_station_rejected_frames') | float(none) %}
          {% set total = (ok + ko) if ok is not none and ko is not none else 0 %}
          {% if rd is none or re is none %}Indisponibilité {% elif re | float(0) < 1 %}Analyse... (deux trames requises) {% else %}{{ rd | int }} / {{ re | int }} trames produites par la station, 30 dernières{% if total >= 20 %} · cumul {{ ok | int }} / {{ total | int }}{% endif %}{% endif %}
        icon: mdi:access-point
        icon_color: >-
          {% set r = states('sensor.jardin_vevor_7_in_1_weather_station_reception_rate') | float(none) %}
          {% if r is none %}blue-grey {% elif r >= 90 %}green {% elif r >= 70 %}amber {% else %}red {% endif %}
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: >-
          {{ states('sensor.jardin_vevor_7_in_1_weather_station_outdoor_temperature', 1) }} °C
        secondary: >-
          Humidité : {{ states('sensor.jardin_vevor_7_in_1_weather_station_outdoor_humidity') }} %
        icon: mdi:thermometer
        icon_color: >-
          {% set temp = states('sensor.jardin_vevor_7_in_1_weather_station_outdoor_temperature') | float(0) %}
          {% if temp < 0 %}indigo{% elif temp < 15 %}blue{% elif temp < 25 %}green{% elif temp < 32 %}orange{% else %}red{% endif %}
        entity: sensor.jardin_vevor_7_in_1_weather_station_outdoor_temperature
      - type: custom:mushroom-template-card
        primary: >-
          {{ (states('sensor.jardin_vevor_7_in_1_weather_station_illuminance') | float(0) / 1000) | round(2) }} klx
        secondary: >-
          UV : {{ states('sensor.jardin_vevor_7_in_1_weather_station_uv_index') | float(0) | round(0) | int }} / 11+
        icon: mdi:white-balance-sunny
        icon_color: >-
          {% set uv = states('sensor.jardin_vevor_7_in_1_weather_station_uv_index') | float(0) %}
          {% if uv <= 2 %}green{% elif uv <= 5 %}yellow{% elif uv <= 7 %}orange{% else %}red{% endif %}
        entity: sensor.jardin_vevor_7_in_1_weather_station_illuminance
  - type: custom:mini-graph-card
    entities:
      - entity: sensor.jardin_vevor_7_in_1_weather_station_outdoor_temperature
        name: Température
      - entity: sensor.jardin_vevor_7_in_1_weather_station_outdoor_humidity
        name: Humidité
        y_axis: secondary
    hours_to_show: 24
    points_per_hour: 6
    line_width: 2
    height: 90
    show:
      extrema: true
      name: false
      icon: false
      state: false
      legend: true
      fill: fade
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:compass-card
        language: fr
        header:
          title:
            value: Vent & Soleil
        indicator_sensors:
          - sensor: sensor.jardin_vevor_7_in_1_weather_station_wind_direction
            state_abbreviation:
              show: false
            indicator:
              image: arrow_inward
              dynamic_style:
                sensor: sensor.jardin_vevor_7_in_1_weather_station_wind_speed
                bands:
                  - from_value: 0
                    color: green
                  - from_value: 40
                    color: orange
                  - from_value: 80
                    color: red
          - sensor: sun.sun
            attribute: azimuth
            state_abbreviation:
              show: false
            indicator:
              image: circle
              dynamic_style:
                sensor: sun.sun
                attribute: elevation
                bands:
                  - from_value: 0
                    show: true
        value_sensors:
          - sensor: sensor.jardin_vevor_7_in_1_weather_station_wind_speed
        compass:
          circle:
            background_image: /local/image/compass_home.png
            background_opacity: 0.7
            show: false
          north:
            show: true
            color: red
          east:
            show: true
          west:
            show: true
          south:
            show: true
      - type: vertical-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.jardin_vevor_7_in_1_weather_station_wind_speed
            name: Vitesse
            icon: mdi:weather-windy
            icon_color: light-blue
          - type: custom:mushroom-entity-card
            entity: sensor.jardin_vevor_7_in_1_weather_station_wind_gust
            name: Rafales
            icon: mdi:weather-windy-variant
            icon_color: deep-orange
          - type: custom:mushroom-entity-card
            entity: sensor.jardin_vevor_7_in_1_weather_station_wind_direction
            name: Direction
            icon: mdi:compass-outline
            icon_color: teal
          - type: custom:mushroom-entity-card
            entity: sun.sun
            name: Soleil
            icon: mdi:sun-angle
            icon_color: yellow
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_total
        primary: >-
          {{ states('sensor.jardin_vevor_7_in_1_weather_station_rain_total', 1) }} mm
        secondary: Cumul depuis la remise à zéro
        icon: mdi:weather-pouring
        icon_color: light-blue
      - type: custom:mushroom-template-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_total
        primary: >-
          {% set c = states.sensor.jardin_vevor_7_in_1_weather_station_rain_total %}
          {{ relative_time(c.last_changed) if c is not none and c.last_changed else 'inconnu' }}
        secondary: Dernière bascule (+0,233 mm)
        icon: mdi:water-plus-outline
        icon_color: blue
  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_hour
        name: Heure
        icon: mdi:weather-pouring
        icon_color: light-blue
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_day
        name: Jour
        icon: mdi:calendar-week-begin
        icon_color: light-blue
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_week
        name: Semaine
        icon: mdi:calendar-week
        icon_color: light-blue
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_month
        name: Mois
        icon: mdi:calendar-weekend
        icon_color: light-blue
        layout: vertical
  - type: custom:mini-graph-card
    name: Cumul de pluie (7 jours)
    icon: mdi:weather-rainy
    entities:
      - entity: sensor.jardin_vevor_7_in_1_weather_station_rain_day
        name: Cumul
        color: '#2196f3'
    aggregate: max
    hours_to_show: 168
    points_per_hour: 1
    line_width: 2
    show:
      graph: line
      name: true
      icon: true
      state: true
      labels: true


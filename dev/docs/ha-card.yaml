# =============================================================================
# Option E — le taux de réception comme ENTITÉ. À créer seulement si vous voulez l'HISTORISER
# (graphe 24 h, statistiques, automatisation) — la section « Réception » le calcule déjà dans la
# carte et n'a besoin d'aucun helper.
#
# Deux façons de la créer, pour le même résultat.
#   a) interface — Paramètres → Appareils et services → Entrées → Créer une entrée → « Modèle »
#      puis « Modèle » (capteur). Nom « Vevor taux de réception », unité « % », classe d'état
#      « Mesure », modèle d'état recopié de la ligne `state:` ci-dessous ;
#   b) configuration.yaml — le bloc ci-dessous.
#
#   template:
#     - sensor:
#         - name: "Vevor taux de réception"
#           unique_id: vevor_taux_reception
#           unit_of_measurement: "%"
#           state_class: measurement
#           state: >-
#             {% set ok = states('sensor.jardin_vevor_7_in_1_weather_station_valid_frames') | float(none) %}
#             {% set ko = states('sensor.jardin_vevor_7_in_1_weather_station_rejected_frames') | float(none) %}
#             {% set total = (ok + ko) if ok is not none and ko is not none else 0 %}
#             {{ (ok / total * 100) | round(1) if total >= 20 else none }}
#
# L'entity_id n'est PAS choisi, il dérive du nom (l'option `object_id` n'existe pas pour un capteur
# `template`). « Vevor taux de réception » donne `sensor.vevor_taux_de_reception` — à VÉRIFIER dans
# Outils de développement → États, filtre « vevor_taux », puis à reporter dans la ligne `entity:`
# du graphe. Un modèle qui rend `none` laisse le capteur à « inconnu » — c'est voulu sous
# 20 trames, et le graphe laisse alors un trou plutôt qu'un point faux.
#
#   - type: custom:mini-graph-card
#     name: Taux de réception (24 h)
#     icon: mdi:access-point-check
#     entities:
#       - entity: sensor.vevor_taux_de_reception
#         name: Trames valides
#         color: '#4caf50'
#     hours_to_show: 24
#     points_per_hour: 6
#     lower_bound: 0
#     upper_bound: 100
#     show:
#       graph: line
#       name: true
#       icon: true
#       state: true
#       labels: true

# =============================================================================
# Option F — ce que la section « Réception » ne peut pas dire, « quelle part des trames ÉMISES
# ai-je reçue ? », et des compteurs qui survivent aux redémarrages de la carte.
#
# Pourquoi un helper. Les deux compteurs du firmware vivent en RAM et repartent de 0 à chaque
# redémarrage de la carte (mesuré 17 fois sur les 24 h des 04-05/10/2026, garde-fou de silence et
# flashages compris), donc le taux de la carte est TOUJOURS « depuis le démarrage ». Un compteur
# d'utilité, lui, ignore une BAISSE de sa source — vérifié dans le code de Home Assistant,
# l'ajustement n'est appliqué que s'il est positif, `net_consumption` étant faux par défaut. La
# remise à zéro de la carte ne fait donc pas reculer le compteur.
#
#   utility_meter:
#     vevor_trames_ok:
#       source: sensor.jardin_vevor_7_in_1_weather_station_valid_frames
#       cycle: daily
#     vevor_trames_ko:
#       source: sensor.jardin_vevor_7_in_1_weather_station_rejected_frames
#       cycle: daily
#
# Créés en YAML, les entity_id viennent des clés ci-dessus (`sensor.vevor_trames_ok`) ; créés dans
# l'interface (Paramètres → Appareils et services → Entrées → Créer une entrée → « Compteur
# d'utilité »), ils viennent du nom choisi. Dans les deux cas, à vérifier dans Outils de
# développement → États. Défaut connu et sans conséquence — la source n'ayant pas d'unité, HA
# journalise une fois « Source sensor ... has no unit of measurement ».
#
# La carte. La station émet une trame toutes les 20 s (3 par minute) et la comparaison porte sur le
# temps DÉJÀ écoulé depuis minuit, sinon le taux serait faux toute la matinée.
#
#   - type: custom:mushroom-template-card
#     entity: sensor.vevor_trames_ok
#     primary: >-
#       {% set ok = states('sensor.vevor_trames_ok') | float(none) %}
#       {% set attendues = ((now() - today_at('00:00')).total_seconds() / 20) | round(0) %}
#       {% if ok is none or attendues < 20 %}en attente
#       {% else %}{{ (ok / attendues * 100) | round(0) | int }} % des trames émises aujourd'hui
#       {% endif %}
#     secondary: >-
#       {% set ok = states('sensor.vevor_trames_ok') | float(none) %}
#       {% set ko = states('sensor.vevor_trames_ko') | float(none) %}
#       {% set attendues = ((now() - today_at('00:00')).total_seconds() / 20) | round(0) %}
#       {% if ok is none or ko is none %}Compteurs indisponibles
#       {% else %}{{ ok | int }} valides · {{ ko | int }} rejetés · {{ attendues | int }} émises depuis minuit
#       {% endif %}
#     icon: mdi:radio-tower
#     icon_color: light-blue
#
# Référence mesurée sur cette installation, 24 h des 04-05/10/2026 — 48,9 % (2 111 valides pour
# 4 320 attendues). Cet encart n'a volontairement pas de seuil de couleur, contrairement à la
# fraîcheur où la cadence de 20 s donne la réponse — la valeur normale d'un taux de réception vous
# appartient, à vous de la fixer.

# =============================================================================
# Option G — être prévenu sans regarder la carte (aucun helper nécessaire).
#
#   - alias: "Vevor 7-en-1 — plus aucune trame reçue"
#     triggers:
#       - trigger: state
#         entity_id: sensor.jardin_vevor_7_in_1_weather_station_tx_counter
#         for: "00:05:00"
#     actions:
#       - action: notify.notify
#         data:
#           message: >-
#             Vevor 7-en-1 — aucune trame depuis 5 min. Dernier verdict
#             {{ states('sensor.jardin_vevor_7_in_1_weather_station_last_verdict') }},
#             {{ states('sensor.jardin_vevor_7_in_1_weather_station_valid_frames') }} valides
#             contre {{ states('sensor.jardin_vevor_7_in_1_weather_station_rejected_frames') }} rejetés.
#
# Le déclencheur se ré-arme à chaque trame, donc `for: 00:05:00` sur « TX counter » ne part que si
# le compteur n'a PAS bougé pendant 5 minutes, soit au-delà des 180 s du garde-fou — la carte a
# alors déjà tenté son réarmement et son redémarrage. Remplacez `notify.notify` par votre service
# de notification, ou par `persistent_notification.create` qui fonctionne partout.

# Option B — remplacer la fenêtre `last_changed` par un vrai DÉBIT, et choisir sa sensibilité.
# C'est la réponse au faux « Pluvieux » : le capteur `statistics` ne compte que les
# échantillons qu'il a lui-même enregistrés, donc il ne peut pas être trompé par une remise à
# zéro du compteur ni par la (re)création de l'entité dans HA — contrairement à la fenêtre
# `last_changed` utilisée par défaut ci-dessus.
#
# 1) Créer l'intensité documentée en dev/docs/forecast-rules.md §8 :
#
# sensor:
#   - platform: statistics
#     name: "Vevor intensité de pluie brute"
#     unique_id: vevor_pluie_intensite_brute
#     entity_id: sensor.jardin_vevor_7_in_1_weather_station_rain_total
#     state_characteristic: change
#     sampling_size: 20
#     max_age: { minutes: 20 }
#   - platform: template
#     name: "Vevor intensité de pluie"
#     unique_id: vevor_pluie_intensite
#     unit_of_measurement: "mm/h"
#     # `change` = Δmm sur 20 min ; ×3 pour l'exprimer en mm/h. Une baisse du compteur donne
#     # un Δ négatif, donc 0 ici : le cas « remise à zéro » est écarté par construction.
#     state: >-
#       {{ [ (states('sensor.vevor_pluie_intensite_brute') | float(0)) * 3, 0 ] | max | round(2) }}
#
# 2) Dans le bandeau, remplacer la ligne de pluie par ces deux-là :
#
#       {% set intensite = states('sensor.vevor_pluie_intensite') | float(0) %}
#       {% set pluie = intensite >= 0.7 %}
#
#     Seuil = ce qu'on accepte d'appeler « il pleut » :
#       0.7 mm/h  → une seule bascule (0,233 mm) dans les 20 min suffit. C'est la lecture de
#                   la règle §4 du document, et c'est ce que la carte fait aujourd'hui : la
#                   bascule isolée passe donc pour de la pluie.
#       1.4 mm/h  → il faut DEUX bascules dans la fenêtre. Une bascule isolée (vent, vibration,
#                   fausse bascule du pluviomètre) ne déclenche plus rien ; une bruine réelle
#                   sous 1,4 mm/h devient invisible. C'est un ÉCART assumé au tableau §5.
#     Choisir 1.4 règle le cas signalé le 03/10 (bandeau « Pluvieux » sans pluie).
#
# 3) Le seuil d'orage 7,6 mm/h (§5, ligne « stormy ») s'ajoute alors sans autre détour :
#
#       {% elif pluie and (rafale >= 40 or intensite >= 7.6) %}Orageux / Tempête
#
# Ce que le capteur `statistics` ne publie pas : la durée réellement couverte. La règle
# « pas encore de débit exploitable » (§4) demande donc une seconde barrière — décrite dans le
# même §8 — avant d'afficher un débit comme une mesure. Pour un simple état oui/non, le
# garde-fou ci-dessus suffit.


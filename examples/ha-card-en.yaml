# Reference Home Assistant dashboard card for this receiver — ENGLISH labels.
#
# Copy it into your dashboard (Raw configuration editor) and adapt the entity ids to your
# own device name: Home Assistant derives them from the ESPHome device name, so a board
# named "Vevor 7-in-1 weather station" exposes sensor.vevor_7_in_1_weather_station_*.
# The ids below are the ones of the author's installation (device "jardin_vevor_7_in_1_weather_station").
# The French twin of this file is examples/ha-card-fr.yaml.
#
# Required cards (HACS): mushroom, mini-graph-card, compass-card.
# Required helpers, four utility_meter counters on the rain total, are given as a commented
# block at the end of this file (the rain/hour/day/week/month tiles use them).
# The equivalent of the station console's forecast icon is NOT here: that icon is not
# receivable (see dev/docs/forecast-rules.md).
type: vertical-stack
cards:
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_tx_counter
        primary: >-
          {% set e = states.sensor.jardin_vevor_7_in_1_weather_station_tx_counter %}
          {% set age = (now() - e.last_changed).total_seconds() if e is not none and e.state not in ('unknown', 'unavailable') and e.last_changed else none %}
          {% if age is none %}unknown {% elif age < 60 %}{{ age | round(0) | int }} s ago {% elif age < 3600 %}{{ (age / 60) | round(0) | int }} min ago {% else %}{{ (age / 3600) | round(1) }} h ago {% endif %}
        secondary: >-
          {% set e = states.sensor.jardin_vevor_7_in_1_weather_station_tx_counter %}
          {% set age = (now() - e.last_changed).total_seconds() if e is not none and e.state not in ('unknown', 'unavailable') and e.last_changed else none %}
          {% if age is none %}Card unreachable, or entity missing {% else %}Frame {{ e.state | int }} at {{ as_timestamp(e.last_changed) | timestamp_custom('%H:%M:%S', true) }} — {% if age <= 35 %}normal reception {% elif age <= 60 %}missed frame {% elif age <= 180 %}silence (re-arm) {% else %}silence (reboot) {% endif %}{% endif %}
        icon: >-
          {% set e = states.sensor.jardin_vevor_7_in_1_weather_station_tx_counter %}
          {% set age = (now() - e.last_changed).total_seconds() if e is not none and e.state not in ('unknown', 'unavailable') and e.last_changed else none %}
          {% if age is none %}mdi:help-circle-outline {% elif age <= 35 %}mdi:clock-check-outline {% elif age <= 180 %}mdi:clock-alert-outline {% else %}mdi:clock-remove-outline {% endif %}
        icon_color: >-
          {% set e = states.sensor.jardin_vevor_7_in_1_weather_station_tx_counter %}
          {% set age = (now() - e.last_changed).total_seconds() if e is not none and e.state not in ('unknown', 'unavailable') and e.last_changed else none %}
          {% if age is none %}grey {% elif age <= 35 %}green {% elif age <= 60 %}amber {% elif age <= 180 %}orange {% else %}red {% endif %}
      - type: custom:mushroom-template-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_reception_rate
        primary: >-
          {% set r = states('sensor.jardin_vevor_7_in_1_weather_station_reception_rate') | float(none) %}
          {% if r is none %}waiting {% else %}{{ r | round(1) }} % {% endif %}
        secondary: >-
          {% set rd = states('sensor.jardin_vevor_7_in_1_weather_station_reception_window_decoded') | float(none) %}
          {% set re = states('sensor.jardin_vevor_7_in_1_weather_station_reception_window_emitted') | float(none) %}
          {% set ok = states('sensor.jardin_vevor_7_in_1_weather_station_valid_frames') | float(none) %}
          {% set ko = states('sensor.jardin_vevor_7_in_1_weather_station_rejected_frames') | float(none) %}
          {% set total = (ok + ko) if ok is not none and ko is not none else 0 %}
          {% if rd is none or re is none %}unavailable {% elif re | float(0) < 1 %}Analyse... (two frames required) {% else %}{{ rd | int }} / {{ re | int }} frames emitted by the station, last 30{% if total >= 20 %} · total {{ ok | int }} / {{ total | int }}{% endif %}{% endif %}
        icon: mdi:access-point
        icon_color: >-
          {% set r = states('sensor.jardin_vevor_7_in_1_weather_station_reception_rate') | float(none) %}
          {% if r is none %}blue-grey {% elif r >= 90 %}green {% elif r >= 70 %}amber {% else %}red {% endif %}
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: >-
          {{ states('sensor.jardin_vevor_7_in_1_weather_station_outdoor_temperature', 1) }} °C
        secondary: >-
          Humidity: {{ states('sensor.jardin_vevor_7_in_1_weather_station_outdoor_humidity') }} %
        icon: mdi:thermometer
        icon_color: >-
          {% set temp = states('sensor.jardin_vevor_7_in_1_weather_station_outdoor_temperature') | float(0) %}
          {% if temp < 0 %}indigo{% elif temp < 15 %}blue{% elif temp < 25 %}green{% elif temp < 32 %}orange{% else %}red{% endif %}
        entity: sensor.jardin_vevor_7_in_1_weather_station_outdoor_temperature
      - type: custom:mushroom-template-card
        primary: >-
          {{ (states('sensor.jardin_vevor_7_in_1_weather_station_illuminance') | float(0) / 1000) | round(2) }} klx
        secondary: >-
          UV: {{ states('sensor.jardin_vevor_7_in_1_weather_station_uv_index') | float(0) | round(0) | int }} / 11+
        icon: >-
          {% set lux = states('sensor.jardin_vevor_7_in_1_weather_station_illuminance') | float(none) %}{% set elev = state_attr('sun.sun', 'elevation') | float(0) %}{% set clair = 133800 * ((elev * pi / 180) | sin) ** 1.15 if elev >= 3 else 0 %}{% set r = lux / clair if (lux is not none and clair > 1) else -1 %}{% if elev < 3 %}mdi:weather-night{% elif lux is none %}mdi:help-circle-outline{% elif r >= 0.70 %}mdi:weather-sunny{% elif r >= 0.35 %}mdi:weather-partly-cloudy{% else %}mdi:weather-cloudy{% endif %}
        icon_color: >-
          {% set uv = states('sensor.jardin_vevor_7_in_1_weather_station_uv_index') | float(0) %}
          {% if uv <= 2 %}green{% elif uv <= 5 %}yellow{% elif uv <= 7 %}orange{% else %}red{% endif %}
        entity: sensor.jardin_vevor_7_in_1_weather_station_illuminance
  - type: custom:mini-graph-card
    entities:
      - entity: sensor.jardin_vevor_7_in_1_weather_station_outdoor_temperature
        name: Temperature
      - entity: sensor.jardin_vevor_7_in_1_weather_station_outdoor_humidity
        name: Humidity
        y_axis: secondary
    hours_to_show: 24
    points_per_hour: 6
    line_width: 2
    height: 90
    show:
      extrema: true
      name: false
      icon: false
      state: false
      legend: true
      fill: fade
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:compass-card
        language: en
        header:
          title:
            value: Wind & Sun
        indicator_sensors:
          - sensor: sensor.jardin_vevor_7_in_1_weather_station_wind_direction
            state_abbreviation:
              show: false
            indicator:
              image: arrow_inward
              dynamic_style:
                sensor: sensor.jardin_vevor_7_in_1_weather_station_wind_speed
                bands:
                  - from_value: 0
                    color: green
                  - from_value: 40
                    color: orange
                  - from_value: 80
                    color: red
          - sensor: sun.sun
            attribute: azimuth
            state_abbreviation:
              show: false
            indicator:
              image: circle
              dynamic_style:
                sensor: sun.sun
                attribute: elevation
                bands:
                  - from_value: 0
                    show: true
        value_sensors:
          - sensor: sensor.jardin_vevor_7_in_1_weather_station_wind_speed
        compass:
          circle:
            background_image: /local/image/compass_home.png
            background_opacity: 0.7
            show: false
          north:
            show: true
            color: red
          east:
            show: true
          west:
            show: true
          south:
            show: true
      - type: vertical-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.jardin_vevor_7_in_1_weather_station_wind_speed
            name: Speed
            icon: mdi:weather-windy
            icon_color: light-blue
          - type: custom:mushroom-entity-card
            entity: sensor.jardin_vevor_7_in_1_weather_station_wind_gust
            name: Gusts
            icon: mdi:weather-windy-variant
            icon_color: deep-orange
          - type: custom:mushroom-entity-card
            entity: sensor.jardin_vevor_7_in_1_weather_station_wind_direction
            name: Direction
            icon: mdi:compass-outline
            icon_color: teal
          - type: custom:mushroom-entity-card
            entity: sun.sun
            name: Sun
            icon: mdi:sun-angle
            icon_color: yellow
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_total
        primary: >-
          {{ states('sensor.jardin_vevor_7_in_1_weather_station_rain_total', 1) }} mm
        secondary: Total since the last reset
        icon: mdi:weather-pouring
        icon_color: light-blue
      - type: custom:mushroom-template-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_total
        primary: >-
          {% set c = states.sensor.jardin_vevor_7_in_1_weather_station_rain_total %}
          {{ relative_time(c.last_changed) if c is not none and c.last_changed else 'unknown' }}
        secondary: Last tip (+0.233 mm)
        icon: mdi:water-plus-outline
        icon_color: blue
  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_hour
        name: Hour
        icon: mdi:weather-pouring
        icon_color: light-blue
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_day
        name: Day
        icon: mdi:calendar-week-begin
        icon_color: light-blue
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_week
        name: Week
        icon: mdi:calendar-week
        icon_color: light-blue
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: sensor.jardin_vevor_7_in_1_weather_station_rain_month
        name: Month
        icon: mdi:calendar-weekend
        icon_color: light-blue
        layout: vertical
  - type: custom:mini-graph-card
    name: Rain total (7 days)
    icon: mdi:weather-rainy
    entities:
      - entity: sensor.jardin_vevor_7_in_1_weather_station_rain_day
        name: Total
        color: '#2196f3'
    aggregate: max
    hours_to_show: 168
    points_per_hour: 1
    line_width: 2
    show:
      graph: line
      name: true
      icon: true
      state: true
      labels: true

# --- Required helpers (paste once, uncommented, in your configuration) -----------------------
# The four rain tiles read utility_meter counters built on the cumulative rain sensor.
# Without them, those four tiles stay empty; everything else works.
#
# utility_meter:
#   rain_hour:
#     source: sensor.jardin_vevor_7_in_1_weather_station_rain_total
#     cycle: hourly
#   rain_day:
#     source: sensor.jardin_vevor_7_in_1_weather_station_rain_total
#     cycle: daily
#   rain_week:
#     source: sensor.jardin_vevor_7_in_1_weather_station_rain_total
#     cycle: weekly
#   rain_month:
#     source: sensor.jardin_vevor_7_in_1_weather_station_rain_total
#     cycle: monthly

# Vevor 7-in-1 weather station receiver, 868 MHz — ESP32-C3 SuperMini + CC1101.
# Wiring, design choices and measurements: dev/docs/firmware-design-notes.md
# Frame layout: dev/references/PROTOCOL.md — decoder: esphome/components/vevor_7in1/vevor_protocol.h

substitutions:
  freq_mhz: "868.35"
  deviation_khz: "70"
  symbol_rate: "11111"
  # 162 kHz, pas 100 : mesuré le 05/10/2026 en fin de soirée, après une panne d'une heure.
  # Le filtre de 100 kHz (±50 kHz) laissait HORS BANDE l'un des deux tons FSK du signal : la
  # déviation est de ±70 kHz, et un quartz dérive de quelques dizaines de kHz sur un écart de
  # température de 5 °C. Résultat : le démodulateur ne rendait que des fragments (47-74 impulsions
  # au lieu de 176), et les captures ne contenaient que du bruit (durées jusqu'à 3352 µs).
  # Balayage mesuré, 150 s par valeur, sur six filtres : 58 kHz → 1 trame ; 81 → 0 ; 100 → 0 ;
  # 162 → 5 trames à la cadence exacte de la station (20 s) ; 203 → 0 ; 232 → non mesuré.
  bw_khz: "162"
  # Log level (see the logger block): INFO in production, DEBUG for a measurement campaign.
  # Raised without editing the file: esphome -s niveau_journal DEBUG compile
  niveau_journal: "INFO"
  # Components fetched from the public repo (see `external_components` below): this YAML is
  # copyable as-is, no repo file needed beside it. In THIS repo, local sources are compiled
  # with `-s vevor_components components`.
  vevor_components: "github://WizardPC/esphome-vevor-7-in-1@main"

esphome:
  name: vevor-7in1
  friendly_name: "Vevor 7-in-1 weather station"   # rename it in Home Assistant, not here
  comment: "Récepteur 868 MHz Vevor 7-in-1 (YT60309) — ESP32-C3 + CC1101"
  on_boot:
    priority: -100          # after every setup(), including the radio and the RMT
    then:
      - lambda: |-
          ESP_LOGD("v7in1", "V7IN1 BOOT recepteur pret, freq=%s MHz dev=%s kHz sr=%s",
                   "${freq_mhz}", "${deviation_khz}", "${symbol_rate}");
  # Put the radio in IDLE before a clean stop: the chip keeps its registers while the ESP32
  # restarts, and its bus lines float during that restart. See design notes §6.
  on_shutdown:
    priority: 600.0
    then:
      - cc1101.set_idle:

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  # Substitutable log level: INFO in production, DEBUG for a measurement campaign.
  # Raise the GLOBAL level (a more verbose per-tag level is rejected): the RAW line and the
  # rejection reasons are DEBUG, hence absent from a production build. See design notes §9.
  level: ${niveau_journal}

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s        # never reboot on client disconnect: it would cut a capture session

ota:
  - platform: esphome
    encryption: {}          # inherits the API key: no separate OTA password
    on_begin:
      then:
        # Second moment the radio is parked in IDLE, during a whole update. See design notes §6.
        - logger.log:
            format: "OTA en cours : passage du CC1101 en IDLE..."
            level: DEBUG
        - cc1101.set_idle:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # These settings depend on the user's NETWORK, not the project: they live in secrets.yaml
  # (unpublished). use_address: only if mDNS does not cross your network (VLAN, other subnet),
  # else OTA cannot find the board.
  use_address: !secret use_address
  # output_power: 8.5dB   # 8.5 dB is the LOWEST value accepted (range 8.5-20.5). Some access points
                          # refuse the board at the default power: uncomment in that case.
  # No `ap:` section on purpose: the board never broadcasts a fallback SSID.

captive_portal:

external_components:
  # Both components come from the public repo: this block is copyable as-is (pin versions by
  # replacing @main with a tag — README §1.5). Building from the local tree requires the override
  # `-s vevor_components components` (tools/build.sh already sets it), else your edits are ignored.
  - source: ${vevor_components}
    refresh: 0s
    # esphome/components/cc1101: local copy of ESPHome's driver — identity re-reads, verified
    # writes, VCO calibration diagnostics, SPI at 1 MHz (this repo's version). See design notes §5.
    components: [vevor_7in1, cc1101]

spi:
  clk_pin: GPIO4
  mosi_pin: GPIO6
  miso_pin: GPIO5

cc1101:
  id: radio
  cs_pin:
    number: GPIO7
    mode:
      output: true
      pullup: true          # an external 10 kΩ pull-up to 3V3 is fitted as well (design notes §6)
  # No gdo0_pin here on purpose: the cc1101 component would take the pin back from the
  # remote_receiver RMT channel. No packet_mode either: the asynchronous path is the one that
  # works on this build. Both points in design notes §7.
  frequency: ${freq_mhz}MHz
  modulation_type: 2-FSK
  symbol_rate: ${symbol_rate}
  fsk_deviation: ${deviation_khz}kHz
  filter_bandwidth: ${bw_khz}kHz

remote_receiver:
  id: rf_receiver
  pin:
    number: GPIO3          # the CC1101 GDO0 pin — a single data wire
  filter: 45us             # half a bit period: shorter pulses are noise (design notes §7)
  idle: 1100us             # closes one burst into one capture
  receive_symbols: 512
  tolerance: 25%

# Pulses → bits → 21 bytes. The component only hands over already-validated frames.
vevor_7in1:
  id: vevor_rx
  receiver_id: rf_receiver
  radio_id: radio          # le garde-fou du composant ré-arme la radio lui-même (cc1101.reset)
  # Identité de la station : en décimal, comme le capteur « Station ID » (33995 = 0x84cb).
  # 0 = apprendre la première station vue ; toute autre valeur ÉPINGLE cette station et fait ignorer
  # les autres ID — c'est ce qui tient dehors la station d'un voisin sur le même protocole.
  # L'ID change à chaque changement de pile : le composant journalise un avertissement s'il voit un
  # autre ID, et remettre cette valeur à 0 (ou forcer « Station ID » depuis Home Assistant) réapprend.
  station_id: 33995
  # Deuxième station, à titre d'exemple : elle aurait son PROPRE jeu de capteurs et son propre bloc.
  # ESPHome ne crée pas d'entités à la volée, donc l'intégrer est l'étape suivante du projet.
  # Tant que l'ID ci-dessus est épinglé, une deuxième station est simplement ignorée, pas publiée.
  # station_id: 12345
  on_frame:
    then:
      - lambda: |-
          vevor::Frame f;
          const char *reason = "taille";
          if (x.size() != vevor::FRAME_BYTES || !vevor::decode(x.data(), f, &reason)) {
            // Safety net: should never happen, the component validates before handing over.
            ESP_LOGW("v7in1", "V7IN1 ANOMALIE trame livree invalide (%u octets, %s)",
                     (unsigned) x.size(), reason);
            id(reason_sensor).publish_state(reason);
            return;
          }
          std::string raw = vevor::hex_bytes(x.data(), x.size());
          ESP_LOGD("v7in1", "V7IN1 RAW %s", raw.c_str());
          id(raw_sensor).publish_state(raw);
          id(reason_sensor).publish_state("ok");
          id(station_id_sensor).publish_state(f.id);
          id(tx_counter_sensor).publish_state(f.tx_counter);
          id(battery_low).publish_state(f.battery_low);
          id(temperature).publish_state(f.temp_c);
          id(humidity).publish_state(f.humidity);
          id(wind_speed).publish_state(f.wind_kmh);
          id(wind_gust).publish_state(f.gust_kmh);
          id(wind_direction).publish_state(f.wind_dir_deg);
          id(rain_total).publish_state(f.rain_mm);
          id(uv_index).publish_state(f.uv_index);
          id(light_lux).publish_state(f.lux);
          // One line per frame (one every 20 s). Deliberately at INFO: the host tools read it.
          ESP_LOGI("v7in1", "V7IN1 OK %s", vevor::to_json(f).c_str());

interval:
  # Internal counters, published as entities.
  # TODO: these four publications are still logic in the YAML; they belong in the component (which
  # then needs the sensor ids). The watchdog itself already lives in the component:
  # esphome/components/vevor_7in1/vevor_7in1.cpp.
  - interval: 10s
    then:
      - lambda: |-
          id(captures_sensor).publish_state(id(vevor_rx).get_captures());
          id(valid_sensor).publish_state(id(vevor_rx).get_frames());
          id(rejected_sensor).publish_state(id(vevor_rx).get_rejected());
          id(duplicates_sensor).publish_state(id(vevor_rx).get_duplicates());

button:
  # Instruments de diagnostic. Le composant les possède (platform: vevor_7in1) : le YAML ne fait
  # que les nommer. « Re-apply radio config » partage le ré-armement du garde-fou.
  - platform: vevor_7in1
    vevor_7in1_id: vevor_rx
    type: dump_pulses
    name: "Dump pulses"
    entity_category: config
  - platform: vevor_7in1
    vevor_7in1_id: vevor_rx
    type: reapply_radio
    name: "Re-apply radio config"
    entity_category: config
  - platform: restart
    name: "Restart board"

number:
  # Reception watchdog: its only two settings, exposed here as Home Assistant entities. The policy
  # lives in the component (esphome/components/vevor_7in1/vevor_7in1.cpp): the YAML only names and
  # bounds. Compiled defaults: 3 slots (60 s) before a re-arm, 180 s of silence before a restart.
  - platform: vevor_7in1
    vevor_7in1_id: vevor_rx
    type: creneaux_avant_rearmement
    name: "Watchdog silent slots before re-arm"
    unit_of_measurement: "x20 s"
    entity_category: config
  - platform: vevor_7in1
    vevor_7in1_id: vevor_rx
    type: duree_max_avant_redemarrage
    name: "Watchdog max silence before restart"
    unit_of_measurement: "s"
    entity_category: config
  # Fast criterion: a capture below this many pulses cannot hold a burst. 40 sits between a fragment
  # (70-96 pulses, normal after an RMT cut) and silence (2-7 pulses, a chip that stopped delivering).
  # DELIBERATELY NOT SHIPPED YET (05/10): the paired on-board test showed a periodic re-arm does not
  # end the deaf episodes (two presses fell inside one and it cleared by itself) while the historical
  # logs show the same outage durations with and without the watchdog. Re-bench before enabling.
  # - platform: vevor_7in1
  #   vevor_7in1_id: vevor_rx
  #   type: seuil_impulsions
  #   name: "Silent capture pulse threshold"
  #   unit_of_measurement: "pulses"
  #   entity_category: config
  # Station identity: 0 (default) learns the first station seen; any other value PINS that station
  # and drops every other ID (a neighbour's station on the same protocol). See vevor_7in1.cpp.
  - platform: vevor_7in1
    vevor_7in1_id: vevor_rx
    type: station_id
    name: "Station ID (0 = learn)"
    entity_category: config
  - platform: template
    name: "CC1101 frequency"
    id: freq_number
    unit_of_measurement: MHz
    min_value: 430.0
    max_value: 930.0
    step: 0.005
    initial_value: 868.35
    optimistic: true
    restore_value: false     # a restored value used to override the compiled frequency
    entity_category: config
    on_value:
      then:
        - cc1101.set_frequency: !lambda "return x * 1000000.0f;"
  # Radio settings exposed so they can be SWEPT LIVE: the driver registers cc1101.set_* actions, so
  # a change takes effect without recompiling. Inert until moved, and no restore_value: a reboot
  # returns to the compiled values. Initial values are the COMPILED ones, and they MUST stay in step
  # with the substitutions above: these entities WRITE their initial value at boot, so a stale 100
  # here silently overrides a compiled 162 (caught 05/10/2026 before the flash).
  - platform: template
    name: "RX filter bandwidth"
    id: bw_number
    unit_of_measurement: kHz
    min_value: 58
    max_value: 812
    step: 1
    initial_value: 162
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      then:
        - cc1101.set_filter_bandwidth: !lambda "return x * 1000.0f;"
  - platform: template
    name: "Data rate"
    id: symbol_rate_number
    unit_of_measurement: baud
    min_value: 600
    max_value: 500000
    step: 50
    initial_value: 11111
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      then:
        - cc1101.set_symbol_rate: !lambda "return x;"
  - platform: template
    name: "FSK deviation"
    id: deviation_number
    unit_of_measurement: kHz
    min_value: 1.5
    max_value: 381
    step: 0.5
    initial_value: 70
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      then:
        - cc1101.set_fsk_deviation: !lambda "return x * 1000.0f;"
  # Marge de compensation de fréquence de la puce : réglée à BW/2 (±81 kHz) dans notre copie locale
  # du pilote (esphome/components/cc1101/cc1101.cpp, commentaire du 05/10/2026). Le pilote n'expose
  # pas d'action cc1101.set_foc_limit, donc ce n'est pas balayable à chaud — la valeur vit dans le
  # code, avec le raisonnement et la mesure. Voir dev/state/CAMPAGNE_20261005.md.

sensor:
  - platform: template
    name: "Outdoor temperature"
    id: temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "Outdoor humidity"
    id: humidity
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Wind speed"
    id: wind_speed
    unit_of_measurement: "km/h"
    device_class: wind_speed
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "Wind gust"
    id: wind_gust
    unit_of_measurement: "km/h"
    device_class: wind_speed
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "Wind direction"
    id: wind_direction
    unit_of_measurement: "°"
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Rain total"
    id: rain_total
    unit_of_measurement: "mm"
    device_class: precipitation
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "UV index"
    id: uv_index
    accuracy_decimals: 0
  - platform: template
    name: "Illuminance"
    id: light_lux
    unit_of_measurement: "lx"
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Station ID"
    id: station_id_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "TX counter"
    id: tx_counter_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "Valid frames"
    id: valid_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "Rejected frames"
    id: rejected_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "RMT captures"
    id: captures_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "Duplicates ignored"
    id: duplicates_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  # Re-arms triggered by the FAST criterion (a capture too short to hold a burst) — as opposed to the
  # slow criterion (a whole silent slot). NOT SHIPPED YET: see the comment on seuil_impulsions above.
  # - platform: template
  #   name: "Radio re-arms (deaf chip)"
  #   id: rearmements_surdite_sensor
  #   accuracy_decimals: 0
  #   entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Station battery low"
    id: battery_low
    device_class: battery

text_sensor:
  - platform: template
    name: "Last raw frame"
    id: raw_sensor
    entity_category: diagnostic
  # Verdict on the last frame handed over: "ok", or the reason it was refused.
  - platform: template
    name: "Last verdict"
    id: reason_sensor
    entity_category: diagnostic

# Vevor 7-in-1 weather station receiver, 868 MHz — ESP32-C3 SuperMini + CC1101.
# Wiring, design choices and the measurements behind them: docs/firmware-design-notes.md
# Frame layout: references/PROTOCOL.md — Decoder: components/vevor_7in1/vevor_protocol.h

substitutions:
  freq_mhz: "868.35"
  deviation_khz: "70"
  symbol_rate: "11111"
  bw_khz: "100"
  # Niveau de journal (voir le bloc logger). INFO en production ; une campagne de mesure le remonte
  # sans éditer le fichier : esphome -s niveau_journal DEBUG compile …
  niveau_journal: "INFO"
  # Composants récupérés depuis le dépôt public (voir `external_components` plus bas) :
  # ce YAML est copiable tel quel chez n'importe qui, aucun fichier du dépôt n'est requis à côté.
  # Dans CE dépôt, on compile les sources locales : `-s vevor_components components`.
  vevor_components: "github://WizardPC/esphome-vevor-7-in-1@main"

esphome:
  name: vevor-7in1
  friendly_name: "Vevor 7-in-1 weather station"   # renommez-le dans Home Assistant, pas ici
  comment: "Récepteur 868 MHz Vevor 7-in-1 (YT60309) — ESP32-C3 + CC1101"
  on_boot:
    priority: -100          # after every setup(), including the radio and the RMT
    then:
      - lambda: |-
          ESP_LOGD("v7in1", "V7IN1 BOOT recepteur pret, freq=%s MHz dev=%s kHz sr=%s",
                   "${freq_mhz}", "${deviation_khz}", "${symbol_rate}");
  # Put the radio in IDLE before a clean stop: the chip keeps its registers while the ESP32
  # restarts, and its bus lines float during that restart. See design notes §6.
  on_shutdown:
    priority: 600.0
    then:
      - cc1101.set_idle:

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  # Niveau de journal SUBSTITUABLE : INFO en production, DEBUG pour une campagne de mesure.
  #   esphome -s niveau_journal DEBUG compile esphome/vevor-7in1.yaml
  # C'est le niveau GLOBAL qu'il faut lever, et non un niveau par tag : ESPHome refuse un tag plus
  # verbeux que le niveau global (« must not be less severe » — mesuré le 03/10, un `logs: {v7in1:
  # DEBUG}` avec `level: INFO` fait échouer la validation). L'enjeu : la ligne « V7IN1 RAW » (les 21
  # octets bruts) et les motifs de rejet sont en DEBUG, donc ABSENTS d'un build de production — or
  # c'est exactement ce que `dev/tools/eval_frames.py` recoupe, et ce qui a manqué pour diagnostiquer les
  # pics de pluie du 03/10. Un build de campagne se fait donc ainsi, sans toucher ce fichier.
  level: ${niveau_journal}

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s        # never reboot on client disconnect: it would cut a capture session

ota:
  - platform: esphome
    encryption: {}          # inherits the API key: no separate OTA password
    on_begin:
      then:
        # Second moment the radio is parked in IDLE, during a whole update. See design notes §6.
        - logger.log:
            format: "OTA en cours : passage du CC1101 en IDLE..."
            level: DEBUG
        - cc1101.set_idle:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Ces deux réglages dépendent du RÉSEAU de l'utilisateur, pas du projet : ils vivent dans
  # secrets.yaml (fichier non publié). Voir secrets.yaml.example.
  #   use_address : à renseigner UNIQUEMENT si mDNS ne traverse pas votre réseau (VLAN, autre
  #                 sous-réseau, carte derrière une passerelle) — sinon ESPHome ne trouve pas
  #                 la carte pour la mise à jour par le réseau.
  #   output_power : à baisser si votre point d'accès refuse la puissance d'émission par défaut.
  use_address: !secret use_address
  output_power: !secret wifi_output_power
  ap:
    ssid: "Vevor-7in1 Fallback"
    password: !secret ap_password

captive_portal:

external_components:
  # Les deux composants viennent du dépôt public : ce bloc est copiable tel quel, rien du dépôt
  # n'est requis à côté du YAML. Voir README §1.5 (versions figées : remplacer @main par un tag).
  # Construire depuis l'arbre local (itération dans ce dépôt) exige la surcharge :
  #   tools/build.sh                                             (déjà le cas)
  #   esphome compile vevor-7in1.yaml -s vevor_components components
  # Sans elle, la compilation irait chercher la version PUBLIÉE et ignorerait vos modifications.
  - source: ${vevor_components}
    refresh: 0s
    # esphome/components/cc1101: local copy of ESPHome's driver — identity re-reads, verified
    # writes, VCO calibration diagnostics, SPI at 1 MHz (this repo's version). See design notes §5.
    components: [vevor_7in1, cc1101]

spi:
  clk_pin: GPIO4
  mosi_pin: GPIO6
  miso_pin: GPIO5

cc1101:
  id: radio
  cs_pin:
    number: GPIO7
    mode:
      output: true
      pullup: true          # an external 10 kΩ pull-up to 3V3 is fitted as well (design notes §6)
  # No gdo0_pin here on purpose: the cc1101 component would take the pin back from the
  # remote_receiver RMT channel. No packet_mode either: the asynchronous path is the one that
  # works on this build. Both points in design notes §7.
  frequency: ${freq_mhz}MHz
  modulation_type: 2-FSK
  symbol_rate: ${symbol_rate}
  fsk_deviation: ${deviation_khz}kHz
  filter_bandwidth: ${bw_khz}kHz

remote_receiver:
  id: rf_receiver
  pin:
    number: GPIO3          # the CC1101 GDO0 pin — a single data wire
  filter: 45us             # half a bit period: shorter pulses are noise (design notes §7)
  idle: 1100us             # closes one burst into one capture
  receive_symbols: 512
  tolerance: 25%

# Pulses → bits → 21 bytes. The component only hands over already-validated frames.
vevor_7in1:
  id: vevor_rx
  receiver_id: rf_receiver
  bit_period: 90us         # 90, 88, 89 and 87 µs are all tried on each capture
  on_frame:
    then:
      - lambda: |-
          vevor::Frame f;
          const char *reason = "taille";
          if (x.size() != vevor::FRAME_BYTES || !vevor::decode(x.data(), f, &reason)) {
            // Safety net: should never happen, the component validates before handing over.
            ESP_LOGW("v7in1", "V7IN1 ANOMALIE trame livree invalide (%u octets, %s)",
                     (unsigned) x.size(), reason);
            id(reason_sensor).publish_state(reason);
            return;
          }
          std::string raw = vevor::hex_bytes(x.data(), x.size());
          ESP_LOGD("v7in1", "V7IN1 RAW %s", raw.c_str());
          id(raw_sensor).publish_state(raw);
          id(reason_sensor).publish_state("ok");
          id(station_id_sensor).publish_state(f.id);
          id(tx_counter_sensor).publish_state(f.tx_counter);
          id(battery_low).publish_state(f.battery_low);
          id(temperature).publish_state(f.temp_c);
          id(humidity).publish_state(f.humidity);
          id(wind_speed).publish_state(f.wind_kmh);
          id(wind_gust).publish_state(f.gust_kmh);
          id(wind_direction).publish_state(f.wind_dir_deg);
          id(rain_total).publish_state(f.rain_mm);
          id(uv_index).publish_state(f.uv_index);
          id(light_lux).publish_state(f.lux);
          // One line per frame (one every 20 s). Deliberately at INFO: the host tools read it.
          ESP_LOGI("v7in1", "V7IN1 OK %s", vevor::to_json(f).c_str());

globals:
  # Counts reboots while the radio was silent. Persistent so a really dead board cannot loop.
  - id: g_reboots_radio
    type: int
    restore_value: true
    initial_value: "0"

script:
  # The single re-arm implementation, called by the button AND by the watchdog: one cc1101.reset
  # (strobe + full configure). Never a chain of setters — see design notes §8.
  - id: rearmer_radio
    then:
      - cc1101.reset: radio

interval:
  # Internal counters, published as entities.
  - interval: 10s
    then:
      - lambda: |-
          id(captures_sensor).publish_state(id(vevor_rx).get_captures());
          id(valid_sensor).publish_state(id(vevor_rx).get_frames());
          id(rejected_sensor).publish_state(id(vevor_rx).get_rejected());
          id(duplicates_sensor).publish_state(id(vevor_rx).get_duplicates());
  # Watchdog. The station transmits one burst every 20 s, day and night, so any silence is a
  # receiver fault. The criterion is PUBLISHED FRAMES, never captures. 30 × 20 s of gentle
  # re-arms, then a reboot — the only remedy measured so far. See design notes §8.
  - interval: 20s
    then:
      - lambda: |-
          static uint32_t dernieres_trames = 0;
          static int muettes = 0;
          const uint32_t t = id(vevor_rx).get_frames();
          if (t != dernieres_trames) {
            dernieres_trames = t;
            muettes = 0;
            id(g_reboots_radio) = 0;
            return;
          }
          muettes++;
          ESP_LOGD("v7in1", "SANTE radio=%s trames=%u captures=%u (aucune trame depuis %d s)",
                   id(radio).is_failed() ? "EN ECHEC" : "ok", (unsigned) t,
                   (unsigned) id(vevor_rx).get_captures(), muettes * 20);
          if (muettes <= 30) {
            ESP_LOGD("v7in1", "aucune trame depuis %d s — tentative d'initialisation radio %d/30",
                     muettes * 20, muettes);
            id(rearmer_radio).execute();
            return;
          }
          if (id(g_reboots_radio) < 10 || (muettes % 45) == 0) {
            id(g_reboots_radio) = id(g_reboots_radio) + 1;
            ESP_LOGW("v7in1", "aucune trame depuis %d min (radio %s, captures=%u) — redemarrage n°%d",
                     muettes / 3, id(radio).is_failed() ? "EN ECHEC" : "ok",
                     (unsigned) id(vevor_rx).get_captures(), (int) id(g_reboots_radio));
            App.safe_reboot();
          }

button:
  # Diagnostic instruments, exposed in Home Assistant as configuration entities.
  - platform: template
    name: "Dump pulses"
    id: dump_button
    entity_category: config
    on_press:
      - lambda: id(vevor_rx).request_raw_dump();
  - platform: template
    name: "Re-apply radio config"
    id: radio_reapply_button
    entity_category: config
    on_press:
      then:
        - script.execute: rearmer_radio
  - platform: restart
    name: "Restart board"

number:
  - platform: template
    name: "CC1101 frequency"
    id: freq_number
    unit_of_measurement: MHz
    min_value: 430.0
    max_value: 930.0
    step: 0.005
    initial_value: 868.35
    optimistic: true
    restore_value: false     # a restored value used to override the compiled frequency
    entity_category: config
    on_value:
      then:
        - cc1101.set_frequency: !lambda "return x * 1000000.0f;"

sensor:
  - platform: template
    name: "Outdoor temperature"
    id: temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "Outdoor humidity"
    id: humidity
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Wind speed"
    id: wind_speed
    unit_of_measurement: "km/h"
    device_class: wind_speed
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "Wind gust"
    id: wind_gust
    unit_of_measurement: "km/h"
    device_class: wind_speed
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "Wind direction"
    id: wind_direction
    unit_of_measurement: "°"
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Rain total"
    id: rain_total
    unit_of_measurement: "mm"
    device_class: precipitation
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "UV index"
    id: uv_index
    accuracy_decimals: 0
  - platform: template
    name: "Illuminance"
    id: light_lux
    unit_of_measurement: "lx"
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Station ID"
    id: station_id_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "TX counter"
    id: tx_counter_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "Valid frames"
    id: valid_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "Rejected frames"
    id: rejected_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "RMT captures"
    id: captures_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "Duplicates ignored"
    id: duplicates_sensor
    accuracy_decimals: 0
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Station battery low"
    id: battery_low
    device_class: battery

text_sensor:
  - platform: template
    name: "Last raw frame"
    id: raw_sensor
    entity_category: diagnostic
  # Verdict on the last frame handed over: "ok", or the reason it was refused.
  - platform: template
    name: "Last verdict"
    id: reason_sensor
    entity_category: diagnostic

# Vevor 7-in-1 weather station receiver, 868 MHz — ESP32-C3 SuperMini + CC1101.
# Wiring, design choices and measured traps: dev/docs/firmware-design-notes.md
# Frame layout: dev/references/PROTOCOL.md — decoder: esphome/components/vevor_7in1/vevor_protocol.h

substitutions:
  freq_mhz: "868.35"
  deviation_khz: "70"
  symbol_rate: "11111"
  # 162 kHz, not 100: at 100 kHz one of the two FSK tones falls out of band (deviation is ±70 kHz,
  # and a quartz drifts by tens of kHz over a few degrees). See design notes, "Configuration traps".
  bw_khz: "162"
  # INFO in production, DEBUG for a measurement campaign (see the logger block).
  niveau_journal: "INFO"
  # Components come from the public repo; building from this tree needs -s vevor_components components.
  vevor_components: "github://WizardPC/esphome-vevor-7-in-1@main"

esphome:
  name: vevor-7in1
  friendly_name: "Vevor 7-in-1 weather station"   # rename it in Home Assistant, not here
  comment: "868 MHz receiver for the Vevor 7-in-1 (YT60309) — ESP32-C3 + CC1101"
  on_boot:
    priority: -100          # after every setup(), including the radio and the RMT
    then:
      - lambda: |-
          ESP_LOGD("v7in1", "V7IN1 BOOT receiver ready, freq=%s MHz dev=%s kHz sr=%s",
                   "${freq_mhz}", "${deviation_khz}", "${symbol_rate}");
  # Park the radio in IDLE before a clean stop: the chip keeps its registers while the ESP32
  # restarts, and its bus lines float during that restart.
  on_shutdown:
    priority: 600.0
    then:
      - cc1101.set_idle:

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: ${niveau_journal}

api:
  encryption:
    key: !secret encryption_key
  reboot_timeout: 0s        # never reboot on client disconnect: it would cut a capture session

ota:
  - platform: esphome
    encryption: {}          # inherits the API key: no separate OTA password
    on_begin:
      then:
        - logger.log:
            format: "OTA: parking the CC1101 in IDLE..."
            level: DEBUG
        - cc1101.set_idle:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Network-dependent, hence in secrets.yaml. use_address is only needed when mDNS does not cross
  # your network (VLAN, other subnet): OTA cannot find the board otherwise.
  use_address: !secret vevor_7in1__use_address
  output_power: 8.5dB       # lowest accepted value (range 8.5-20.5); raise it if your AP refuses

captive_portal:

external_components:
  - source: ${vevor_components}
    refresh: 0s
    components: [vevor_7in1, cc1101]

spi:
  clk_pin: GPIO4
  mosi_pin: GPIO6
  miso_pin: GPIO5

cc1101:
  id: radio
  cs_pin:
    number: GPIO7
    mode:
      output: true
      pullup: true          # an external 10 kΩ pull-up to 3V3 is fitted as well
  # No gdo0_pin on purpose: the cc1101 component would take the pin back from the remote_receiver
  # RMT channel, and nothing would then be captured. No packet_mode either: only the asynchronous
  # path works on this build.
  frequency: ${freq_mhz}MHz
  modulation_type: 2-FSK
  symbol_rate: ${symbol_rate}
  fsk_deviation: ${deviation_khz}kHz
  filter_bandwidth: ${bw_khz}kHz

remote_receiver:
  id: rf_receiver
  pin:
    number: GPIO3          # the CC1101 GDO0 pin — a single data wire
  filter: 45us             # half a bit period: shorter pulses are noise
  # Do NOT raise: 2000us and 8000us both let the interferer's 77 ms burst in as ONE capture, which
  # overflows the C3's RMT buffer and kills the receiver. Measured, with the timeline: design notes.
  idle: 1100us
  receive_symbols: 512
  tolerance: 25%

# Pulses → bits → 21 bytes. The component only hands over already-validated frames.
vevor_7in1:
  id: vevor_rx
  receiver_id: rf_receiver
  radio_id: radio          # the component's watchdog re-arms the radio itself (cc1101.reset)
  # Station identity, in decimal as the "Station ID" sensor reads it (33995 = 0x84cb).
  # 0 = learn the first station seen; any other value PINS that station and ignores every other ID,
  # which is how a neighbour's station on the same protocol stays out. The ID changes with the
  # batteries: the component logs a warning on another ID, and 0 (or "Station ID" in HA) re-learns.
  station_id: 33995
  # Second station example: it would need its own sensor set and its own block, since ESPHome does
  # not create entities on the fly. While the ID above is pinned, a second station stays ignored.
  # station_id: 12345
  on_frame:
    then:
      - lambda: |-
          vevor::Frame f;
          const char *reason = "size";
          if (x.size() != vevor::FRAME_BYTES || !vevor::decode(x.data(), f, &reason)) {
            // Safety net: should never happen, the component validates before handing over.
            ESP_LOGW("v7in1", "V7IN1 ANOMALY invalid frame handed over (%u bytes, %s)",
                     (unsigned) x.size(), reason);
            id(reason_sensor).publish_state(reason);
            return;
          }
          std::string raw = vevor::hex_bytes(x.data(), x.size());
          ESP_LOGD("v7in1", "V7IN1 RAW %s", raw.c_str());
          id(raw_sensor).publish_state(raw);
          id(reason_sensor).publish_state("ok");
          id(station_id_sensor).publish_state(f.id);
          id(tx_counter_sensor).publish_state(f.tx_counter);
          id(battery_low).publish_state(f.battery_low);
          id(temperature).publish_state(f.temp_c);
          id(humidity).publish_state(f.humidity);
          id(wind_speed).publish_state(f.wind_kmh);
          id(wind_gust).publish_state(f.gust_kmh);
          id(wind_direction).publish_state(f.wind_dir_deg);
          id(rain_total).publish_state(f.rain_mm);
          id(uv_index).publish_state(f.uv_index);
          id(light_lux).publish_state(f.lux);
          // One line per frame (one every 20 s). Deliberately at INFO: the host tools read it.
          ESP_LOGI("v7in1", "V7IN1 OK %s", vevor::to_json(f).c_str());

interval:
  # TODO: these publications are still YAML logic; they belong in the component.
  - interval: 10s
    then:
      - lambda: |-
          id(captures_sensor).publish_state(id(vevor_rx).get_captures());
          id(valid_sensor).publish_state(id(vevor_rx).get_frames());
          id(rejected_sensor).publish_state(id(vevor_rx).get_rejected());
          id(duplicates_sensor).publish_state(id(vevor_rx).get_duplicates());
          id(reception_rate_sensor).publish_state(id(vevor_rx).get_reception_rate());
          id(window_decoded_sensor).publish_state(id(vevor_rx).get_window_decoded());
          id(window_emitted_sensor).publish_state(id(vevor_rx).get_window_emitted());

button:
  - platform: vevor_7in1
    vevor_7in1_id: vevor_rx
    type: dump_pulses
    name: "Dump pulses"
    entity_category: config
  - platform: vevor_7in1
    vevor_7in1_id: vevor_rx
    type: reapply_radio
    name: "Re-apply radio config"
    entity_category: config
  - platform: restart
    name: "Restart board"

number:
  # Watchdog settings; the policy lives in the component. Compiled defaults: a re-arm after 3 silent
  # slots (60 s), a restart after 180 s of silence.
  - platform: vevor_7in1
    vevor_7in1_id: vevor_rx
    type: rearm_after_slots
    name: "Watchdog silent slots before re-arm"
    unit_of_measurement: "x20 s"
    entity_category: config
  - platform: vevor_7in1
    vevor_7in1_id: vevor_rx
    type: max_restart_delay
    name: "Watchdog max silence before restart"
    unit_of_measurement: "s"
    entity_category: config
  - platform: vevor_7in1
    vevor_7in1_id: vevor_rx
    type: station_id
    name: "Station ID (0 = learn)"
    entity_category: config
  # Radio settings exposed so they can be swept live: the driver registers cc1101.set_* actions, so
  # a change needs no recompile. No restore_value: a reboot returns to the compiled values. Their
  # initial_value MUST match the substitutions above — these entities WRITE their initial value at
  # boot, so a stale 100 here silently overrides a compiled 162.
  - platform: template
    name: "CC1101 frequency"
    id: freq_number
    unit_of_measurement: MHz
    min_value: 430.0
    max_value: 930.0
    step: 0.005
    initial_value: 868.35
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      then:
        - cc1101.set_frequency: !lambda "return x * 1000000.0f;"
  - platform: template
    name: "RX filter bandwidth"
    id: bw_number
    unit_of_measurement: kHz
    min_value: 58
    max_value: 812
    step: 1
    initial_value: 162
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      then:
        - cc1101.set_filter_bandwidth: !lambda "return x * 1000.0f;"
  - platform: template
    name: "Data rate"
    id: symbol_rate_number
    unit_of_measurement: baud
    min_value: 600
    max_value: 500000
    step: 50
    initial_value: 11111
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      then:
        - cc1101.set_symbol_rate: !lambda "return x;"
  - platform: template
    name: "FSK deviation"
    id: deviation_number
    unit_of_measurement: kHz
    min_value: 1.5
    max_value: 381
    step: 0.5
    initial_value: 70
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      then:
        - cc1101.set_fsk_deviation: !lambda "return x * 1000.0f;"

# Diagnostic: names the reason for the previous restart (Brownout, Task Watchdog, Panic, ...).
# A restart that leaves no line in the log is otherwise unattributable — the restarts of 07/10
# (12:26, 12:38, 13:29, ~15:49) all ended with the log stream simply stopping.
debug:

sensor:
  - platform: template
    name: "Outdoor temperature"
    id: temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "Outdoor humidity"
    id: humidity
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Wind speed"
    id: wind_speed
    unit_of_measurement: "km/h"
    device_class: wind_speed
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "Wind gust"
    id: wind_gust
    unit_of_measurement: "km/h"
    device_class: wind_speed
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "Wind direction"
    id: wind_direction
    unit_of_measurement: "°"
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Rain total"
    id: rain_total
    unit_of_measurement: "mm"
    device_class: precipitation
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    name: "UV index"
    id: uv_index
    accuracy_decimals: 0
  - platform: template
    name: "Illuminance"
    id: light_lux
    unit_of_measurement: "lx"
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Station ID"
    id: station_id_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "TX counter"
    id: tx_counter_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "Valid frames"
    id: valid_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "Rejected frames"
    id: rejected_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "RMT captures"
    id: captures_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "Duplicates ignored"
    id: duplicates_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  # Share of the station's OWN transmissions actually decoded, over the last 30 frames (~10 min),
  # computed in the component from the station's counter — not from elapsed time.
  - platform: template
    name: "Reception rate"
    id: reception_rate_sensor
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
  # The two terms of that ratio, so a dashboard can read "29 / 30" instead of trusting a percentage.
  - platform: template
    name: "Reception window decoded"
    id: window_decoded_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "Reception window emitted"
    id: window_emitted_sensor
    accuracy_decimals: 0
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Station battery low"
    id: battery_low
    device_class: battery

text_sensor:
  - platform: template
    name: "Last raw frame"
    id: raw_sensor
    entity_category: diagnostic
  # Verdict on the last frame handed over: "ok", or the reason it was refused.
  - platform: template
    name: "Last verdict"
    id: reason_sensor
    entity_category: diagnostic
  # Why the ESP32 rebooted: the one word that ends a restart investigation (see `debug:` above).
  - platform: debug
    reset_reason:
      name: "Reset reason"
      entity_category: diagnostic

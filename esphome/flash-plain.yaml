# Auxiliary file — ONE purpose only: OTA-upload a binary to a board whose OTA requires no key
# (e.g. a board flashed with third-party firmware). It describes the same device WITHOUT
# `encryption:` in `ota:`, so the upload goes in clear, as that board expects.

# ESPHome sets OTA encryption from the `ota:` block of the config USED for the upload
# (`USE_OTA_ENCRYPTION` is defined only if `ota:` has `encryption:`): `vevor-7in1.yaml` declares
# `encryption: {}` and would propose it, which a keyless board refuses.

# Nothing is built from this file (it has no radio component): pass `--file` with the binary
# already built by vevor-7in1.yaml.

# Usage:
#   .venv/bin/esphome upload esphome/flash-plain.yaml --device <board-ip> \
#       --file esphome/.esphome/build/vevor-7in1/build/firmware.ota.bin

esphome:
  name: vevor-7in1
  friendly_name: "Vevor 7-in-1 weather station"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: !secret use_address
